# Dependabot configuration for agy-company repository
# Group updates into a single monthly PR and restrict breaking major upgrades
version: 2
updates:
  # 1. Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/dashboard/frontend"
    schedule:
      # Run checks once a month to avoid notification overload
      interval: "monthly"
    # Keep maximum open pull requests limited to 1 at any time
    open-pull-requests-limit: 1
    # Combine all individual dependency upgrades into a single consolidated PR
    groups:
      frontend-deps:
        patterns:
          - "*"
    # Ignore breaking major version upgrades to prevent ecosystem incompatibility
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 2. Backend dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/dashboard/backend"
    schedule:
      # Run checks once a month to avoid notification overload
      interval: "monthly"
    # Keep maximum open pull requests limited to 1 at any time
    open-pull-requests-limit: 1
    # Combine all individual dependency upgrades into a single consolidated PR
    groups:
      backend-deps:
        patterns:
          - "*"
    # Ignore breaking major version upgrades to prevent FastAPI / Pydantic incompatibilities
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
